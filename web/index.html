<!doctype html>
<html lang="en" data-theme="tome">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pathfinder Sheet</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/theme-tome.css">
  <link rel="stylesheet" href="css/pet.css">
</head>
<body>
  <nav id="nav">
    <div class="brand"><img class="logo" src="icon.png" alt=""><span>Pathfinder<br><small>1e Sheet</small></span></div>
    <button data-view="home"><span class="ico">☰</span>Characters</button>
    <button data-view="sheet"><span class="ico">📜</span>Sheet</button>
    <button data-view="levelup"><span class="ico">⬆</span>Level Up</button>
    <button data-view="compendium"><span class="ico">📖</span>Compendium</button>
    <button data-view="rules"><span class="ico">⚖</span>Quick Rules</button>
    <div class="grow"></div>
    <div id="cookie-slot" aria-label="Cookie"></div>
    <button id="changelog-btn" title="What changed in recent updates"><span class="ico">✨</span>What’s new</button>
    <button id="options-btn" title="Theme, text size and other options"><span class="ico">⚙</span>Options</button>
  </nav>
  <div id="shell">
    <header id="topbar">
      <button id="char-icon" class="char-icon" hidden title="Character icon: click to change it"><img id="char-avatar" alt="" hidden><span class="plus">＋</span></button>
      <div class="grow"><div id="char-title">Loading…</div><div id="char-sub" class="muted small"></div></div>
      <div id="sheet-search-wrap" hidden><input id="sheet-search" class="search" type="search" placeholder="Search this character…  (Ctrl+F)" autocomplete="off"><div id="sheet-results" hidden></div></div>
      <span id="save-state" class="muted small"></span>
    </header>
    <main id="main"></main>
  </div>
  <aside id="drawer" aria-label="Reference"></aside>
  <div id="toasts"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
